<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>中英快譯</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="bar">
    <div class="tabs" role="tablist">
      <button class="tab active" id="tabTranslate" data-mode="translate">翻譯</button>
      <button class="tab" id="tabPrompt" data-mode="prompt">圖片提示詞</button>
    </div>
    <span class="status" id="status"></span>
  </header>

  <main>
    <div class="pane">
      <textarea id="input" placeholder="輸入或貼上中文… 片語、長句都可以" spellcheck="false" autofocus></textarea>
      <div class="pane-foot">
        <span class="count" id="count">0 字</span>
        <div class="foot-right">
          <button id="swap" class="ghost" title="切換翻譯方向">中 → 英 ⇄</button>
          <button id="clear" class="ghost">清除</button>
        </div>
      </div>
    </div>

    <!-- 圖片提示詞設定 -->
    <section id="promptOpts" hidden>
      <div class="chips" id="styleChips"></div>
      <div class="toggles">
        <label><input type="checkbox" id="optQuality" checked> 畫質標籤</label>
        <label><input type="checkbox" id="optWeight"> 主體加權</label>
        <label><input type="checkbox" id="optNeg" checked> 負面提示詞</label>
      </div>
    </section>

    <!-- 翻譯輸出 -->
    <div class="pane out" id="translateOut">
      <div id="output" class="output" tabindex="0"></div>
      <div class="pane-foot">
        <span class="hint">Ctrl + Enter 立即翻譯並複製</span>
        <button id="copy" class="primary" disabled>複製</button>
      </div>
    </div>

    <!-- 提示詞輸出 -->
    <div id="promptOut" hidden>
      <div class="pane out">
        <div class="pane-label">正向提示詞 <span class="tokens" id="posLen"></span></div>
        <div id="posOut" class="output mono" tabindex="0"></div>
        <div class="pane-foot">
          <span class="hint">Ctrl + Enter 立即產生並複製</span>
          <button id="copyPos" class="primary" disabled>複製正向</button>
        </div>
      </div>

      <div class="pane out neg" id="negPane">
        <div class="pane-label">負面提示詞</div>
        <div id="negOut" class="output mono small" tabindex="0"></div>
        <div class="pane-foot">
          <span class="hint">貼到 negative prompt 欄位</span>
          <button id="copyNeg" class="ghost-btn" disabled>複製負向</button>
        </div>
      </div>
    </div>
  </main>

  <section class="history" id="historyWrap" hidden>
    <div class="history-head">
      <span>最近使用</span>
      <button id="clearHistory" class="ghost">清空</button>
    </div>
    <ul id="history"></ul>
  </section>

  <script src="popup.js"></script>
</body>
</html>
